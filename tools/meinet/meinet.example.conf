# MeiNet gateway config (docs/BROADCAST.md, "The gateway").
# Copy to meinet.conf (kept out of git) and edit.

[meinet]
# Home city for page 0x400, looked up with Open-Meteo's geocoding API.
# "City" or "City, State/Country" to narrow it down. Empty: no home page.
home =
# Or give the place directly (skips the lookup):
# home_name = Somewhere
# home_lat = 0.0
# home_lon = 0.0

host = 127.0.0.1
port = 9600
# Minutes between fetches of current conditions and forecasts, and of the map grid.
refresh_minutes = 15
map_refresh_minutes = 180
# The coarse national temperature grid, columns x rows (each point is one API location).
map_grid = 30x14
# Bit-error rate added to the stream, for testing receivers (e.g. 1e-4). 0: clean.
noise = 0

[regions]
# Replace or add regions: N = Region; City; lat; lon; south; north; west; east
# 9 = Alaska; Anchorage; 61.22; -149.90; 55.0; 66.0; -160.0; -140.0
